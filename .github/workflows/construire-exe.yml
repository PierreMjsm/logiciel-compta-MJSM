name: Construire le .exe Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Tests
        run: npm test

      - name: Fabriquer le .exe
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Mettre le .exe à disposition (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Compta-Banque-Windows
          path: dist/*.exe
          retention-days: 30

      - name: Publier une version (seulement pour un tag v…)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
